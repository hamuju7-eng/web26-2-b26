<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        //변수를 선언합니다.
        let i=2;
        let array=['가','나','다'];
        //반복을 수행합니다. i가 배열 원소 개수인 3보다 적을 때 반복합니다.
        while(i<array.length){
            //출력합니다.
            alert(i+'번째 출력:'+array[i]);
            //탈출하려고 변수를 더합니다.
            i++;
        }
    </script>
</head>
<body>
    while반복문<hr>
    <ul>
        <li>불 표현식이 참이면 중괄호 안 문장을 계속 실행</li>
        <li>조건을 거짓으로 만드는 문장이 없으면 무한 반복</li>
    </ul>

    <hr>
    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>
</html>

    <!DOCTYPE html> 
<html Lang="kor">
<head>
    <meta charter="UTF-8">

    <title>반응/상태/구조 선택자</title>
    <style>
        h1:hover{color:red;}
        h1:active{color:blue;}
        /*input 태그가 사용 가능할때 background-color 속성에 orange 키워드를 적용합니다*/
        input:enabled{background-color:orange;}
         /*input 태그가 사용 가능할때 background-color 속성에 gray 키워드를 적용합니다*/
        input:disabled{background-color:gray;}
         /*input 태그가 사용 가능할때 background-color 속성에 green 키워드를 적용합니다*/
        input:focus{background-color:green;}

    </style>
</head>
<body>
    <h1>1.반응 선택자</h1>
    <h1>2.상태 선택자</h1>

    <h2> 사용 가능</h2>
    <input>
    <h2>사용 불가능</h2>
    <input disabled="disabled">
</body>
</html>

<!DOCTYPE html> 
<html Lang="kor">
<head>
    <meta charter="UTF-8">

    <title>HTML5 Basic</title>
    <style>
        #header>h1{color:red;}
        /*#section>h1{color:orange}*/

        #header h1,h2{color:red;}
        #header h1,#header h2{color:red;}

        table>tr>th{
            color:red;
        }
    </style>
</head>
<body>
    <h2>자손 선택자</h2>
    <hr>
    <p>table태그에 스타일을 적용할 때는 자손 선택자를 사용하면 안됨</p>
    <table border="1"> 
        <tr>
            <th>이름</th>
            <th>지역</th>
        </tr>
        <tr>
            <th>우주</th>
            <th>서울특별시 고양양양</th>
        </tr>
    </table>



    <hr>
    <div id="header">
        <h1 class="title">Lorem ipsum</h1>
        <div id="nav">
            <h1>navigation</h1>
            <h2>headerd안의 h2- csss select</h2>
        </div>
    </div>
    <div id="section">
        <h1 class="title">Lorem ipsum</h1>
        <h2>headerd안의 h2- csss select</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    </div>
</body>
</html>
